# Ghostty configuration
# https://ghostty.org/docs/config

font-family = JetBrains Mono
font-size=13
theme = catppuccin-mocha

window-padding-x = 8
macos-option-as-alt = true

# Start from nothing so only the binds below apply.
keybind = clear

keybind = cmd+shift+d=new_split:right
keybind = cmd+d=new_split:down
keybind=cmd+w=close_surface
keybind = cmd+enter=toggle_fullscreen
keybind = ctrl+shift+t=new_tab
keybind = cmd+alt+left=goto_split:left
keybind = cmd+alt+right=goto_split:right

# A leader sequence: ctrl+a then n
keybind = ctrl+a>n=new_tab

# Drop a default we do not want.
keybind = cmd+k=unbind

# A trigger prefix unikeys does not model.
keybind = global:cmd+grave_accent=toggle_quick_terminal

# An action that contains an equals sign.
keybind = cmd+shift+h=text:x=1

this line is not a setting at all

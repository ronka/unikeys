<!doctype html>
<!--
  Source for docs/img/og-card.png — the link preview card.
  Rendered at 1200x630 (the 1.91:1 ratio every social scraper crops to).

  Regenerate from the repo root after changing this file. The 2x scale factor is
  what keeps it sharp on retina; --virtual-time-budget is what waits for the
  Google Fonts to land, without which the type renders in a fallback face.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=2 --window-size=1200,630 \
      --virtual-time-budget=20000 \
      --screenshot=/tmp/og-2x.png \
      "file://$PWD/tools/og.html"
    pngquant --quality 82-98 --speed 1 --force \
      --output docs/img/og-card.png /tmp/og-2x.png

  Output is 2400x1260, ~145 KB. Update og:image:width/height in docs/index.html
  if that changes, and ship it under a NEW filename each time the art changes —
  Facebook, LinkedIn and Slack cache preview images by URL and will otherwise
  keep serving the old one. docs/img/og.png is the retired 1200x750 card, kept
  so previews already cached against that URL don't break.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens are the landing page's, which are the app's. */
      :root {
        --ground: #101114;
        --text: #e7e9ee;
        --muted: #8b8f9a;
        --line: #272930;
        --blue: #7ba7f8;
        --gold: #f2c24b;
        --display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
        --body: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: var(--ground);
        color: var(--text);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
      }

      /* Two lights, same ones the hero uses — blue from the left, violet behind
         the screenshot so its edges don't die into the ground. */
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
      }
      .glow-a {
        left: -220px;
        top: -260px;
        width: 780px;
        height: 700px;
        background: radial-gradient(circle, rgba(80, 116, 220, 0.5), transparent 68%);
      }
      .glow-b {
        right: -160px;
        bottom: -300px;
        width: 800px;
        height: 700px;
        background: radial-gradient(circle, rgba(122, 92, 220, 0.4), transparent 68%);
      }

      /* ---- left column: the words ---- */
      .copy {
        position: absolute;
        left: 68px;
        top: 66px;
        width: 570px;
        z-index: 3;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 25px;
        letter-spacing: -0.01em;
      }
      .mark img {
        width: 40px;
        height: 40px;
        border-radius: 9px;
      }

      .eyebrow {
        margin-top: 78px;
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--blue);
      }
      h1 {
        margin-top: 16px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 68px;
        line-height: 1.03;
        letter-spacing: -0.032em;
      }
      .lede {
        margin-top: 26px;
        font-size: 20px;
        line-height: 1.55;
        color: var(--muted);
        max-width: 560px;
      }
      .lede b {
        color: var(--text);
        font-weight: 500;
      }

      .foot {
        position: absolute;
        left: 70px;
        bottom: 66px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 3;
        font-size: 15px;
        color: var(--muted);
      }
      .pill {
        padding: 7px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(30, 32, 38, 0.7);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
      }
      .pill.key {
        font-family: var(--mono);
        color: var(--gold);
        border-color: rgba(242, 194, 75, 0.32);
      }

      /* ---- right: the app itself, bleeding off the corner ---- */
      .shot {
        position: absolute;
        left: 622px;
        top: 128px;
        width: 830px;
        border-radius: 14px 0 0 0;
        border: 1px solid #2f323b;
        border-right: 0;
        border-bottom: 0;
        overflow: hidden;
        background: #16171b;
        box-shadow:
          0 40px 90px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        z-index: 2;
      }
      .chrome {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 15px;
        background: #1a1c21;
        border-bottom: 1px solid #24262d;
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .shot img {
        display: block;
        width: 100%;
      }
      /* Fade the far edge so the crop reads as intentional, not cut off. */
      .fade {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 165px;
        z-index: 4;
        background: linear-gradient(
          to right,
          rgba(16, 17, 20, 0),
          rgba(16, 17, 20, 0.55) 55%,
          rgba(16, 17, 20, 0.96)
        );
      }
    </style>
  </head>
  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <div class="shot">
      <div class="chrome">
        <span class="dot" style="background: #ff5f57"></span>
        <span class="dot" style="background: #febc2e"></span>
        <span class="dot" style="background: #28c840"></span>
      </div>
      <img src="../docs/img/01-keys.png" alt="" />
    </div>
    <div class="fade"></div>

    <div class="copy">
      <div class="mark"><img src="../docs/img/app-icon.png" alt="" />unikeys</div>
      <p class="eyebrow">Thirteen apps · one table</p>
      <h1>Every shortcut,<br />side by side.</h1>
      <p class="lede">
        VSCode, Cursor, Zed, WebStorm, Ghostty, Obsidian —<br />one row per action, one column per
        app.<br /><b>Settle a whole row with one press.</b>
      </p>
    </div>

    <div class="foot">
      <span class="pill">macOS</span>
      <span class="pill key">⇧⌘P</span>
      <span>Free · open source · signed and notarized</span>
    </div>
  </body>
</html>

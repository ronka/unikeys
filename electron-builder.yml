appId: com.ronkaa.unikeys
productName: unikeys
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: unikeys
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - universal
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    # unikeys reads and writes other apps' config files. Application Support is
    # not TCC-protected, but an Obsidian vault or a hand-picked config may well
    # sit in Documents or Downloads, and macOS prompts for those by name.
    - NSDocumentsFolderUsageDescription: unikeys needs access to read and update keybinding files stored in your Documents folder, such as an Obsidian vault.
    - NSDownloadsFolderUsageDescription: unikeys needs access to read and update keybinding files stored in your Downloads folder.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
  # electron-builder notarizes and staples the .app but leaves the DMG itself
  # untouched, and the DMG is what people download. Unsigned, Gatekeeper rejects
  # it outright ("no usable signature"). Signing here; `npm run notarize:dmg`
  # then notarizes and staples the image.
  sign: true
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
